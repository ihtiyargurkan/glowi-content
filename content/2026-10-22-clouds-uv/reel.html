<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../lib/base.css">
<style>
  .stage { background: linear-gradient(180deg, #DCE6EE 0%, #EEDDE2 70%); }
  #sky { left: 0; top: 260px; width: 1080px; height: 900px; }
  #t1 { top: 1180px; font-size: 128px; padding: 0 70px; }
  #t1 .w:last-child { color: var(--rose); }
  #upto { top: 360px; font-size: 54px; font-weight: 800; letter-spacing: .2em; }
  #pct { top: 430px; font-size: 470px; line-height: 1; letter-spacing: -.05em; }
  #t2 { top: 1000px; font-size: 92px; padding: 0 90px; }
  #src { top: 1660px; font-size: 34px; font-weight: 600; color: var(--ink-soft); }
  #t3a, #t3b { font-size: 120px; padding: 0 70px; }
  #t3a { top: 420px; } #t3b { top: 980px; }
  #t3a .w:last-child { color: var(--ink-soft); } #t3b .w:last-child { color: var(--rose); }
  #darkbg { inset: 0; background: var(--plum-deep); }
  #end { top: 300px; font-size: 118px; padding: 0 70px; color: var(--ivory); }
  #end .w:nth-last-child(-n+2) { color: var(--gold); }
  #endHandle { top: 1650px; font-size: 48px; font-weight: 800; letter-spacing: .14em; color: var(--ivory); }
  #flash { inset: 0; background: #fff; pointer-events: none; }
  .ray { position: absolute; width: 14px; height: 0; background: linear-gradient(180deg, rgba(232,169,58,0), rgba(232,169,58,.95)); border-radius: 7px; }
</style></head>
<body>
<div class="stage">
  <div class="blob" style="width:900px;height:900px;left:-250px;top:-200px;background:#fff"></div>
  <div class="blob" style="width:700px;height:700px;right:-250px;top:1200px;background:#E9B9C6"></div>
  <div class="handle" style="right:70px;top:90px">GLOWI</div>

  <div id="b1">
    <svg id="sky" class="abs" viewBox="0 0 1080 900">
      <g id="sun" transform="translate(540 430)">
        <g id="rays"></g>
        <circle r="190" fill="#F2B544"/>
        <circle r="150" fill="#F7C866"/>
      </g>
      <g id="cloudA" fill="#FFFFFF" opacity=".97">
        <ellipse cx="0" cy="0" rx="300" ry="120"/><ellipse cx="-140" cy="-60" rx="150" ry="140"/><ellipse cx="90" cy="-100" rx="190" ry="170"/>
      </g>
      <g id="cloudB" fill="#F4F6F9" opacity=".95">
        <ellipse cx="0" cy="0" rx="260" ry="100"/><ellipse cx="-110" cy="-50" rx="130" ry="120"/><ellipse cx="80" cy="-80" rx="160" ry="140"/>
      </g>
    </svg>
    <div id="t1" class="abs center hook">Cloudy day? Skip the SPF?</div>
  </div>

  <div id="b2">
    <div id="upto" class="abs center">UP TO</div>
    <div id="pct" class="abs center serif"><span id="pctN">0</span>%</div>
    <div id="t2" class="abs center hook">of UV rays can get through clouds</div>
    <div id="src" class="abs center">Source: Skin Cancer Foundation</div>
    <div id="raybox" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
  </div>

  <div id="b3">
    <div id="t3a" class="abs center hook">Clouds block the heat you feel.</div>
    <div id="t3b" class="abs center hook">Not the UV you don't.</div>
  </div>

  <div id="b4">
    <div id="darkbg" class="abs"></div>
    <div id="end" class="abs center hook">Check the UV, not the sky</div>
    <div id="uvcard" class="abs card" style="left:140px;right:140px;top:720px;height:660px;color:var(--plum);padding:56px 64px">
      <div class="eyebrow" style="opacity:.6">Today · Partly cloudy</div>
      <div style="display:flex;align-items:flex-end;gap:28px;margin-top:30px"><div class="serif" id="uvNum" style="font-size:250px;line-height:.9">0</div><div style="font-weight:800;font-size:56px;padding-bottom:26px">UV<br><span style="color:var(--gold)">Moderate</span></div></div>
      <div id="uvNote" style="margin-top:46px;font-weight:700;font-size:48px;line-height:1.2;background:var(--blush-2);border-radius:28px;padding:30px 36px">☀︎ SPF before you head out, even under clouds.</div>
    </div>
    <div id="endHandle" class="abs center">FOLLOW FOR SKIN, DECODED</div>
  </div>
  <div id="flash" class="abs"></div>
</div>
<script src="../../lib/anim.js"></script>
<script>
window.DURATION = 13; window.COVER = 1.8;
const B = [0, 3.0, 6.8, 9.6];
// build sun rays + falling UV rays once
const rays = $("#rays");
for (let i = 0; i < 16; i++) { const a = i * 22.5; rays.innerHTML += `<rect x="-9" y="-310" width="18" height="90" rx="9" fill="#F2B544" transform="rotate(${a})"/>`; }
const box = $("#raybox");
for (let i = 0; i < 14; i++) { const r = document.createElement("div"); r.className = "ray"; r.style.left = (90 + i * 68) + "px"; box.appendChild(r); }
function scene(t) {
  win($("#b1"), t, 0, B[1]); win($("#b2"), t, B[1], B[2]); win($("#b3"), t, B[2], B[3]); win($("#b4"), t, B[3], 99);
  flash($("#flash"), t, B);
  // 1: sun spins, clouds slide over it from frame 0
  $("#sun").setAttribute("transform", `translate(540 430) rotate(${t * 40}) scale(${1 + .04 * Math.sin(t * 3)})`);
  const ca = lerp(-420, 470, pr(t, 0, 2.2, E.inOut)), cb = lerp(1500, 640, pr(t, 0, 2.4, E.inOut));
  $("#cloudA").setAttribute("transform", `translate(${ca} 470)`);
  $("#cloudB").setAttribute("transform", `translate(${cb} 600)`);
  words($("#t1"), t, .15, .12);
  // 2: counter races to 80 and locks; rays fall
  if (t >= B[1]) {
    const lt = t - B[1];
    show($("#upto"), lt, 0, .25, 20);
    count($("#pctN"), lt, 0, 1.0, 80);
    $("#pct").style.transform = `scale(${1 + .08 * Math.sin(clamp((lt - 1) / .22) * Math.PI)})`;
    words($("#t2"), lt, 1.15, .08);
    show($("#src"), lt, 1.8, .3, 10);
    $$(".ray").forEach((r, i) => {
      const ph = ((lt * 1.3 + i * .23) % 1);
      r.style.top = (-200 + ph * 2200) + "px"; r.style.height = "220px"; r.style.opacity = .35 + .4 * Math.sin(i);
    });
  }
  // 3: contrast re-hook
  if (t >= B[2]) { const lt = t - B[2]; words($("#t3a"), lt, 0, .09); words($("#t3b"), lt, 1.0, .1); }
  // 4: end card
  if (t >= B[3]) {
    const lt = t - B[3];
    words($("#end"), lt, .05, .09);
    show($("#uvcard"), lt, .45, .45, 160);
    count($("#uvNum"), lt, .6, .9, 5);
    show($("#uvNote"), lt, 1.4, .35, 30);
    show($("#endHandle"), lt, 1.9, .4, 20);
    $(".handle").style.color = "var(--ivory)";
  } else $(".handle").style.color = "";
}
</script>
</body></html>
